spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=manga_schema
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.hibernate.format_sql: true

  kafka:
    # 1. ที่อยู่ของ Server
    bootstrap-servers: localhost:9092
    topic:
      name: push.manga
    consumer:
      # 2. ชื่อกลุ่มผู้รับ
      group-id: group
      # 3. ถ้าเป็น Consumer ใหม่ ให้เริ่มอ่านจากข้อความแรกสุด
      auto-offset-reset: earliest
      # 4. ระบุ Class สำหรับแปลงข้อมูล (สำคัญ: ต้องตรงกับ Type ใน Java)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ปิด auto commit เพื่อให้ manual ack ทำงานได้สมบูรณ์
      enable-auto-commit: false
      properties:
        fetch.max.bytes: 10485760
        max.partition.fetch.bytes: 10485760

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.request.size: 10485760 # แก้ RecordTooLarge (10MB)
    listener:
      ack-mode: manual
      concurrency: 3
      missing-topics-fatal: false
      auto-startup: true

logging:
  level:
    org.springframework.kafka: INFO
    org.apache.kafka: INFO
